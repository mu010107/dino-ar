<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DINOSSIER 001</title>

<style>
html,body{
margin:0;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
background:#0d1d12;
color:white;
}

body{
background:
linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.45)),
url("https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1600&q=80")
center/cover no-repeat fixed;
}

body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 20% 30%,rgba(255,255,255,.12),transparent 30%),
radial-gradient(circle at 70% 15%,rgba(255,255,180,.15),transparent 28%);
pointer-events:none;
}

body::after{
content:"";
position:fixed;
inset:0;
background:url("https://www.transparenttextures.com/patterns/foggy-birds.png");
opacity:.18;
animation:fog 25s linear infinite;
pointer-events:none;
}

@keyframes fog{
from{transform:translateX(-80px);}
to{transform:translateX(80px);}
}

header{
position:absolute;
top:20px;
width:100%;
text-align:center;
z-index:5;
}

h1{
margin:5px 0;
font-size:3rem;
color:#eef6d8;
}

small{
letter-spacing:6px;
color:#b6d27a;
font-weight:bold;
}

iframe{
position:absolute;
border:0;
left:-25%;
top:5%;
width:150%;
height:90%;
}

.bottom{
position:absolute;
left:0;
right:0;
bottom:0;
padding:20px;
display:flex;
gap:10px;
backdrop-filter:blur(12px);
background:rgba(25,35,20,.45);
}

button{
flex:1;
padding:16px;
border:none;
border-radius:16px;
font-size:16px;
font-weight:bold;
background:#edf3e4;
}

button:nth-child(2){
background:#466b2d;
color:white;
}
</style>
</head>

<body>

<header>
<small>DINOSSIER 001</small>
<h1>TIRANOSSAURO REX</h1>
<div><i>Tyrannosaurus rex</i></div>
</header>

<iframe
allowfullscreen
allow="autoplay; xr-spatial-tracking"
src="https://sketchfab.com/models/38007d947ae74dea83988cb0b08ee053/embed?autostart=1&animation_autoplay=1&ui_infos=0&ui_controls=0&ui_stop=0&ui_watermark=0&ui_watermark_link=0">
</iframe>

<div class="bottom">
<button>ℹ Informações</button>
<button>🥽 Ver em RA</button>
<button>🔊 Rugido</button>
</div>

</body>
</html>
